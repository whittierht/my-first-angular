<div class="panel panel-default" *ngIf="contact">
  <div class="panel-heading clearfix">
    <div class="pull-left">
      <h3 class="panel-title">{{ contact.name }}</h3>
    </div>

    <div class="pull-right">
      <a class="btn btn-primary" [routerLink]="['edit']">Edit</a>
      <a class="btn btn-danger" (click)="onDelete()">Delete</a>
    </div>
  </div>

  
  <div class="panel-body">
    <img
      *ngIf="contact.imageUrl"
      [src]="contact.imageUrl"
      [alt]="contact.name"
      class="img-responsive"
      style="max-height: 150px; margin-bottom: 15px;"
    />

    <p><strong>Email:</strong> {{ contact.email }}</p>
    <p><strong>Phone:</strong> {{ contact.phone }}</p>
  </div>
</div>
