<div class="panel panel-default">
  <div class="panel-heading">
    <h3 class="panel-title">
      {{ editMode ? 'Edit Document' : 'Add Document' }}
    </h3>
  </div>

  <div class="panel-body">
    <form #f="ngForm" (ngSubmit)="onSubmit(f)">
      <div class="form-group">
        <label for="name">Document Title</label>
        <input
          type="text"
          id="name"
          class="form-control"
          name="name"
          required
          #name="ngModel"
          [ngModel]="document?.name"
        />
      </div>

      <div class="form-group">
        <label for="description">Document Description</label>
        <input
          type="text"
          id="description"
          class="form-control"
          name="description"
          [ngModel]="document?.description"
        />
      </div>

      <div class="form-group">
        <label for="url">Document URL</label>
        <input
          type="text"
          id="url"
          class="form-control"
          name="url"
          required
          #url="ngModel"
          [ngModel]="document?.url"
        />
      </div>

      <div
        class="alert alert-danger"
        *ngIf="!name.valid || !url.valid"
      >
        The Document Title and Document URL are required fields.
      </div>

      <button
        class="btn btn-success"
        type="submit"
        [disabled]="!f.valid"
      >
        Save
      </button>

      <button
        class="btn btn-danger"
        type="button"
        (click)="onCancel()"
      >
        Cancel
      </button>
    </form>
  </div>
</div>
