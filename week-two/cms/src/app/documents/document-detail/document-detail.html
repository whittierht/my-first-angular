<div class="panel panel-default" *ngIf="document">
  <div class="panel-heading clearfix">
    <h3 class="panel-title pull-left">{{ document.name }}</h3>

    <div class="pull-right">
      <a class="btn btn-primary" (click)="onView()">View</a>
      <a class="btn btn-info" [routerLink]="['edit']">Edit</a>
      <a class="btn btn-danger" (click)="onDelete()">Delete</a>
    </div>
  </div>

  <div class="panel-body">
    <p><strong>Description:</strong> {{ document.description }}</p>
    <p><strong>URL:</strong> {{ document.url }}</p>
  </div>
</div>
